<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <title>TrueDrive Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #c8392b;
      --bg: #f5f4f0;
      --card: #ffffff;
      --text: #1a1a18;
      --muted: #8a8a82;
      --border: #e5e4e0;
      --green: #15803d;
      --green-bg: #dcfce7;
      --red-bg: #fee2e2;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-box {
      background: var(--card); border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .login-logo { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    .login-logo span { color: var(--accent); }
    .login-box h2 { font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-bottom: 32px; }
    .login-box label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
    .login-box input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.95rem; font-family: inherit;
      margin-bottom: 16px; background: var(--bg); color: var(--text);
      transition: border-color .2s;
    }
    .login-box input:focus { outline: none; border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 13px; background: var(--accent); color: white;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity .2s;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-error {
      display: none; margin-top: 12px; padding: 10px 14px;
      background: var(--red-bg); color: var(--accent); border-radius: 8px;
      font-size: 0.85rem;
    }

    /* ── DASHBOARD ── */
    #dashboard { display: none; }

    .topbar {
      background: var(--text); color: white;
      padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; }
    .topbar-logo span { color: var(--accent); }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-email { font-size: 0.82rem; color: rgba(255,255,255,0.5); }
    .logout-btn {
      background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem;
      font-family: inherit; transition: all .2s;
    }
    .logout-btn:hover { color: white; border-color: rgba(255,255,255,0.5); }

    .dash-inner { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .dash-header h1 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }
    .add-btn {
      background: var(--accent); color: white; border: none;
      padding: 10px 22px; border-radius: 8px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity .2s;
    }
    .add-btn:hover { opacity: 0.88; }

    /* Stats row */
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .stat-box {
      background: var(--card); border-radius: 12px; padding: 20px;
      border: 1px solid var(--border);
    }
    .stat-box h3 { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
    .stat-box p  { font-size: 0.8rem; color: var(--muted); }

    /* Cars table */
    .table-wrap {
      background: var(--card); border-radius: 12px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .table-wrap table { width: 100%; border-collapse: collapse; }
    .table-wrap th {
      text-align: left; padding: 14px 16px;
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .table-wrap td {
      padding: 14px 16px; font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap tr:hover td { background: #fafaf8; }

    .car-thumb {
      width: 60px; height: 44px; border-radius: 6px;
      object-fit: cover; background: var(--bg);
      display: block;
    }
    .car-thumb-placeholder {
      width: 60px; height: 44px; border-radius: 6px;
      background: var(--bg); display: flex; align-items: center;
      justify-content: center; font-size: 1.4rem;
    }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 100px;
      font-size: 0.72rem; font-weight: 600;
    }
    .badge-available { background: var(--green-bg); color: var(--green); }
    .badge-sold      { background: var(--red-bg); color: var(--accent); }

    .action-btns { display: flex; gap: 6px; }
    .edit-btn, .delete-btn, .sold-btn {
      padding: 5px 12px; border-radius: 6px; font-size: 0.78rem;
      font-weight: 500; cursor: pointer; border: none; font-family: inherit;
      transition: opacity .2s;
    }
    .edit-btn   { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .sold-btn   { background: var(--green-bg); color: var(--green); }
    .unsold-btn { background: var(--red-bg); color: var(--accent); }
    .delete-btn { background: var(--red-bg); color: var(--accent); }
    .edit-btn:hover, .delete-btn:hover, .sold-btn:hover { opacity: 0.75; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty-state p { margin-bottom: 16px; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 200;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card); border-radius: 16px;
      width: 100%; max-width: 620px; max-height: 90vh;
      overflow-y: auto; padding: 36px;
    }
    .modal-box h2 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.82rem; font-weight: 500; color: var(--muted); }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.9rem; font-family: inherit;
      background: var(--bg); color: var(--text); transition: border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group .hint { font-size: 0.75rem; color: var(--muted); }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .cancel-btn {
      padding: 10px 20px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: inherit;
    }
    .save-btn {
      padding: 10px 24px; background: var(--accent); color: white;
      border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity .2s;
    }
    .save-btn:hover { opacity: 0.88; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: white; padding: 12px 24px;
      border-radius: 8px; font-size: 0.88rem; font-weight: 500;
      display: none; z-index: 300; white-space: nowrap;
    }
    #toast.show { display: block; }
    #toast.success { background: #15803d; }
    #toast.error   { background: var(--accent); }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .dash-inner { padding: 20px 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      .table-wrap th:nth-child(3),
      .table-wrap td:nth-child(3),
      .table-wrap th:nth-child(5),
      .table-wrap td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">|TRUE<span>DRIVE</span></div>
    <h2>Admin Dashboard — Sign In</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>


<!-- ══ DASHBOARD ══ -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo">|TRUE<span>DRIVE</span> Admin</div>
    <div class="topbar-right">
      <span class="topbar-email" id="userEmail"></span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="dash-inner">
    <div class="dash-header">
      <h1>Inventory Management</h1>
      <button class="add-btn" onclick="openAddModal()">+ Add New Car</button>
    </div>

    <div class="stats-row" id="statsRow">
      <div class="stat-box"><h3 id="statTotal">—</h3><p>Total Cars</p></div>
      <div class="stat-box"><h3 id="statAvailable">—</h3><p>Available</p></div>
      <div class="stat-box"><h3 id="statSold">—</h3><p>Sold</p></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Car</th>
            <th>Price</th>
            <th>Status</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="carsTableBody">
          <tr><td colspan="6"><div class="empty-state"><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>


<!-- ══ ADD / EDIT MODAL ══ -->
<div class="modal-overlay" id="carFormModal">
  <div class="modal-box">
    <h2 id="modalTitle">Add New Car</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Make *</label>
        <input type="text" id="fMake" placeholder="e.g. Toyota" />
      </div>
      <div class="form-group">
        <label>Model *</label>
        <input type="text" id="fModel" placeholder="e.g. Mark X" />
      </div>
      <div class="form-group">
        <label>Year *</label>
        <input type="number" id="fYear" placeholder="e.g. 2015" min="1990" max="2030" />
      </div>
      <div class="form-group">
        <label>Price *</label>
        <input type="text" id="fPrice" placeholder="e.g. KSh 1,500,000" />
      </div>
      <div class="form-group">
        <label>Fuel</label>
        <select id="fFuel">
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="Hybrid">Hybrid</option>
          <option value="Electric">Electric</option>
        </select>
      </div>
      <div class="form-group">
        <label>Transmission</label>
        <select id="fTrans">
          <option value="Auto">Automatic</option>
          <option value="Manual">Manual</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mileage</label>
        <input type="text" id="fMileage" placeholder="e.g. 75,000 km" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="fLocation" placeholder="e.g. Nairobi" value="Nairobi" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="fCategory">
          <option value="sedan">Sedan</option>
          <option value="suv">SUV</option>
          <option value="hatchback">Hatchback</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="available">Available</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Description</label>
        <textarea id="fDesc" placeholder="e.g. Clean, accident-free, full service history."></textarea>
      </div>
      <div class="form-group full">
        <label>Photos (comma-separated filenames)</label>
        <textarea id="fPhotos" placeholder="images/car-front.jpeg, images/car-side.jpeg, images/car-interior.jpeg"></textarea>
        <span class="hint">Each photo must be uploaded to the /images folder in your GitHub repo first.</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeFormModal()">Cancel</button>
      <button class="save-btn" id="saveBtn" onclick="saveCar()">Save Car →</button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast"></div>


<script>
  const SUPABASE_URL = 'https://qmeosvkrbogdfmokgkpa.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtZW9zdmtyYm9nZGZtb2tna3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDE5MjAsImV4cCI6MjA5Mzg3NzkyMH0.J_WDhH7n5C1HciuL45GSiQhPQXq2FS-creSdyvEHYDs';

  var authToken  = null;
  var editingId  = null;
  var carsCache  = [];

  /* ── AUTH HELPERS ── */
  function authHeaders() {
    return {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (authToken || SUPABASE_KEY),
      'Content-Type': 'application/json'
    };
  }

  /* ── LOGIN ── */
  async function doLogin() {
    var email    = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errEl    = document.getElementById('loginError');
    var btn      = document.querySelector('.login-btn');

    if (!email || !password) { showLoginError('Please enter your email and password.'); return; }

    btn.textContent = 'Signing in...';
    btn.disabled    = true;
    errEl.style.display = 'none';

    try {
      var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      var data = await res.json();

      if (!res.ok || !data.access_token) {
        showLoginError(data.error_description || 'Invalid email or password.');
      } else {
        authToken = data.access_token;
        document.getElementById('userEmail').textContent = email;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadCars();
      }
    } catch (err) {
      showLoginError('Connection error. Please try again.');
    }

    btn.textContent = 'Sign In →';
    btn.disabled    = false;
  }

  function showLoginError(msg) {
    var el = document.getElementById('loginError');
    el.textContent    = msg;
    el.style.display  = 'block';
  }

  function doLogout() {
    authToken = null;
    document.getElementById('dashboard').style.display    = 'none';
    document.getElementById('loginScreen').style.display  = 'flex';
    document.getElementById('loginPassword').value        = '';
  }

  /* Allow Enter key on login */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
      doLogin();
    }
  });


  /* ── LOAD CARS ── */
  async function loadCars() {
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/cars?order=id.asc', {
        headers: authHeaders()
      });
      carsCache = await res.json();
      renderTable();
      renderStats();
    } catch (err) {
      showToast('Failed to load cars.', 'error');
    }
  }


  /* ── RENDER TABLE ── */
  function renderTable() {
    var tbody = document.getElementById('carsTableBody');
    if (!carsCache.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>No cars yet.</p></div></td></tr>';
      return;
    }

    tbody.innerHTML = carsCache.map(function(car) {
      var photos = [];
      if (car.photos && typeof car.photos === 'string' && car.photos.trim()) {
        photos = car.photos.split(',').map(function(p) { return p.trim(); }).filter(Boolean);
      }
      var thumb = photos.length
        ? '<img src="' + photos[0] + '" class="car-thumb" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
          '<div class="car-thumb-placeholder" style="display:none">' + (car.category === 'suv' ? '🚙' : '🚗') + '</div>'
        : '<div class="car-thumb-placeholder">' + (car.category === 'suv' ? '🚙' : '🚗') + '</div>';

      var isAvailable = car.status === 'available';
      var badge = '<span class="badge ' + (isAvailable ? 'badge-available' : 'badge-sold') + '">' +
        (isAvailable ? '✓ Available' : '✗ Sold') + '</span>';

      var toggleBtn = isAvailable
        ? '<button class="sold-btn" onclick="toggleStatus(' + car.id + ', \'sold\')">Mark Sold</button>'
        : '<button class="unsold-btn" onclick="toggleStatus(' + car.id + ', \'available\')">Mark Available</button>';

      return '<tr>' +
        '<td>' + thumb + '</td>' +
        '<td><strong>' + car.make + ' ' + car.model + '</strong><br><span style="color:var(--muted);font-size:0.8rem">' + car.year + '</span></td>' +
        '<td>' + (car.price || '—') + '</td>' +
        '<td>' + badge + '</td>' +
        '<td style="text-transform:capitalize">' + (car.category || '—') + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="edit-btn" onclick="openEditModal(' + car.id + ')">Edit</button>' +
          toggleBtn +
          '<button class="delete-btn" onclick="deleteCar(' + car.id + ')">Delete</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }


  /* ── RENDER STATS ── */
  function renderStats() {
    var total     = carsCache.length;
    var available = carsCache.filter(function(c) { return c.status === 'available'; }).length;
    var sold      = carsCache.filter(function(c) { return c.status === 'sold'; }).length;
    document.getElementById('statTotal').textContent     = total;
    document.getElementById('statAvailable').textContent = available;
    document.getElementById('statSold').textContent      = sold;
  }


  /* ── ADD MODAL ── */
  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add New Car';
    document.getElementById('fMake').value     = '';
    document.getElementById('fModel').value    = '';
    document.getElementById('fYear').value     = '';
    document.getElementById('fPrice').value    = '';
    document.getElementById('fFuel').value     = 'Petrol';
    document.getElementById('fTrans').value    = 'Auto';
    document.getElementById('fMileage').value  = '';
    document.getElementById('fLocation').value = 'Nairobi';
    document.getElementById('fCategory').value = 'sedan';
    document.getElementById('fStatus').value   = 'available';
    document.getElementById('fDesc').value     = '';
    document.getElementById('fPhotos').value   = '';
    document.getElementById('carFormModal').classList.add('open');
  }


  /* ── EDIT MODAL ── */
  function openEditModal(id) {
    var car = null;
    for (var i = 0; i < carsCache.length; i++) {
      if (carsCache[i].id === id) { car = carsCache[i]; break; }
    }
    if (!car) return;
    editingId = id;

    document.getElementById('modalTitle').textContent = 'Edit Car';
    document.getElementById('fMake').value     = car.make     || '';
    document.getElementById('fModel').value    = car.model    || '';
    document.getElementById('fYear').value     = car.year     || '';
    document.getElementById('fPrice').value    = car.price    || '';
    document.getElementById('fFuel').value     = car.fuel     || 'Petrol';
    document.getElementById('fTrans').value    = car.trans    || 'Auto';
    document.getElementById('fMileage').value  = car.mileage  || '';
    document.getElementById('fLocation').value = car.location || 'Nairobi';
    document.getElementById('fCategory').value = car.category || 'sedan';
    document.getElementById('fStatus').value   = car.status   || 'available';
    document.getElementById('fDesc').value     = car.desc     || '';
    document.getElementById('fPhotos').value   = car.photos   || '';
    document.getElementById('carFormModal').classList.add('open');
  }

  function closeFormModal() {
    document.getElementById('carFormModal').classList.remove('open');
    editingId = null;
  }


  /* ── SAVE CAR ── */
  async function saveCar() {
    var make  = document.getElementById('fMake').value.trim();
    var model = document.getElementById('fModel').value.trim();
    var year  = parseInt(document.getElementById('fYear').value);
    var price = document.getElementById('fPrice').value.trim();

    if (!make || !model || !year || !price) {
      showToast('Please fill in Make, Model, Year and Price.', 'error');
      return;
    }

    var payload = {
      make:     make,
      model:    model,
      year:     year,
      price:    price,
      fuel:     document.getElementById('fFuel').value,
      trans:    document.getElementById('fTrans').value,
      mileage:  document.getElementById('fMileage').value.trim(),
      location: document.getElementById('fLocation').value.trim() || 'Nairobi',
      category: document.getElementById('fCategory').value,
      status:   document.getElementById('fStatus').value,
      desc:     document.getElementById('fDesc').value.trim(),
      photos:   document.getElementById('fPhotos').value.trim()
    };

    var btn = document.getElementById('saveBtn');
    btn.textContent = 'Saving...';
    btn.disabled    = true;

    try {
      var url    = SUPABASE_URL + '/rest/v1/cars';
      var method = 'POST';
      var headers = Object.assign({}, authHeaders(), { 'Prefer': 'return=minimal' });

      if (editingId) {
        url    = SUPABASE_URL + '/rest/v1/cars?id=eq.' + editingId;
        method = 'PATCH';
      }

      var res = await fetch(url, { method: method, headers: headers, body: JSON.stringify(payload) });

      if (res.ok) {
        showToast(editingId ? 'Car updated!' : 'Car added!', 'success');
        closeFormModal();
        loadCars();
      } else {
        var err = await res.json();
        showToast('Error: ' + (err.message || 'Could not save.'), 'error');
      }
    } catch (err) {
      showToast('Connection error. Please try again.', 'error');
    }

    btn.textContent = 'Save Car →';
    btn.disabled    = false;
  }


  /* ── TOGGLE STATUS ── */
  async function toggleStatus(id, newStatus) {
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/cars?id=eq.' + id, {
        method: 'PATCH',
        headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ status: newStatus })
      });
      if (res.ok) {
        showToast('Status updated!', 'success');
        loadCars();
      } else {
        showToast('Could not update status.', 'error');
      }
    } catch (err) {
      showToast('Connection error.', 'error');
    }
  }


  /* ── DELETE CAR ── */
  async function deleteCar(id) {
    var car = carsCache.find(function(c) { return c.id === id; });
    var name = car ? car.make + ' ' + car.model : 'this car';
    if (!confirm('Are you sure you want to delete ' + name + '? This cannot be undone.')) return;

    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/cars?id=eq.' + id, {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (res.ok) {
        showToast('Car deleted.', 'success');
        loadCars();
      } else {
        showToast('Could not delete car.', 'error');
      }
    } catch (err) {
      showToast('Connection error.', 'error');
    }
  }


  /* ── TOAST ── */
  var toastTimer;
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent  = msg;
    t.className    = 'show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.className = ''; }, 3000);
  }

  /* Close modal on backdrop click */
  document.getElementById('carFormModal').addEventListener('click', function(e) {
    if (e.target === this) closeFormModal();
  });
</script>
</body>
</html>
